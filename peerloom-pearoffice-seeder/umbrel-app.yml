manifestVersion: 1
id: peerloom-pearoffice-seeder
name: PearOffice Seeder (now PeerLoom Seeder)
icon: https://peerloomllc.com/assets/icon-pearoffice-seeder.svg
tagline: Now PeerLoom Seeder. New installs should use PeerLoom Seeder
category: networking
version: "1.0.1"
port: 8761
description: >-
  PearOffice Seeder is now PeerLoom Seeder, one seeder for every PeerLoom app.
  This is its last release under the old name.


  Already installed? Update and keep it. It keeps the same seeder, paired
  devices and stored files, so your devices need nothing, and it now serves
  PearList, PearCal, PearCircle and PearPetal too.


  Not installed yet? Install PeerLoom Seeder from this store instead. Do not
  run both: they use the same port.


  It is a "blind" seeder: it stores and serves only encrypted data and is never
  given the keys, so your Umbrel keeps your files available without ever being
  able to read them.


developer: PeerLoom
website: https://peerloomllc.com
dependencies: []
repo: https://github.com/peerloomllc/pearoffice-releases
support: https://github.com/peerloomllc/pearoffice-releases/issues
gallery: []
releaseNotes: >-
  PearOffice Seeder is now PeerLoom Seeder 1.0.0, one seeder for every PeerLoom
  app. Your seeder, paired devices and stored files are kept. Full release
  notes: https://github.com/peerloomllc/peerloom-seeder/releases/tag/v1.0.0
path: ""
defaultUsername: ""
# umbrelOS shows the derived app password next to the app when this is set
# (see peerloom-peartune/umbrel-app.yml). The compose passes it as
# SEEDER_PASSWORD.
deterministicPassword: true
submitter: PeerLoom
submission: https://github.com/peerloomllc/pearoffice-releases
