manifestVersion: 1
id: peerloom-pearsheet-seeder
name: PearSheet Seeder
icon: https://peerloomllc.com/assets/icon-pearsheet-seeder.svg
tagline: Keep your shared PearSheet spreadsheets online 24/7
category: networking
version: "0.1.0"
port: 8761
description: >-
  Run a blind seeder for your PearSheet spreadsheets on your Umbrel, so the
  people you share a sheet with stay in sync even when every device is off.


  PearSheet is a peer-to-peer spreadsheet app with no accounts and no servers:
  a sheet lives only on the devices of the people it is shared with and syncs
  directly between them. That means a sheet is only reachable while one of
  those devices is online. This app keeps an always-on copy of each sheet your
  devices back up to it, so everyone catches up whoever is online.


  It is a "blind" seeder: it stores and serves only encrypted data and is never
  given a sheet's key, so your Umbrel keeps your sheets available without ever
  being able to read them.


  To pair a device: open the seeder, enter the password shown next to the app,
  choose Pair a device, then scan the code in PearSheet under Seeder.
developer: PeerLoom
website: https://peerloomllc.com
dependencies: []
repo: https://github.com/peerloomllc/pearsheet
support: https://github.com/peerloomllc/pearsheet/issues
gallery: []
releaseNotes: >-
  First release.
path: ""
defaultUsername: ""
# umbrelOS shows the derived app password next to the app when this is set
# (see peerloom-peartune/umbrel-app.yml). The compose passes it as
# SEEDER_PASSWORD.
deterministicPassword: true
submitter: PeerLoom
submission: https://github.com/peerloomllc/pearsheet
